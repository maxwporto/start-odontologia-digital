<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#168c91"><title>START Odontologia Digital</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#193b3e;background:#f2f8f8}*{box-sizing:border-box}body{margin:0}header{background:#168c91;color:white;padding:18px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:19px;margin:0}h2{font-size:19px;margin:5px 0 16px}.wrap{max-width:960px;margin:auto;padding:16px 16px 90px}.card{background:white;border:1px solid #d9e7e7;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #00000008}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:12px;border:1px solid #b8cdcd;border-radius:9px;background:white;margin:5px 0 12px}button{cursor:pointer;border:0;border-radius:9px;padding:12px 14px;background:#168c91;color:white;font-weight:650}button.secondary{background:#e7f2f2;color:#175e61}button.danger{background:#9b3030}button:disabled{opacity:.5}label{font-size:13px;font-weight:650}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.muted{color:#607777;font-size:13px}.money{font-weight:750;color:#08696e}.nav{display:flex;overflow:auto;gap:6px;padding:9px;background:white;border-bottom:1px solid #d9e7e7;position:sticky;top:0;z-index:2}.nav button{white-space:nowrap;background:#edf5f5;color:#24686a}.nav button.active{background:#168c91;color:white}.item{border-top:1px solid #e6eeee;padding:12px 0}.item:first-child{border:0}.hidden{display:none!important}.notice{padding:12px;border-radius:9px;background:#e5f5ef;margin-bottom:12px}.error{background:#ffe9e7;color:#822a25}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{padding:8px 10px;font-size:13px}.stat{font-size:25px;font-weight:750}.wide{grid-column:1/-1}@media(min-width:720px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media print{header,.nav,button,.no-print,#auth{display:none!important}body{background:white}.wrap{padding:0}.card{box-shadow:none;border:0}}

/* Painel inicial redesenhado: isolado das demais telas */
.dashboard{display:grid;gap:16px}.dashboard-head{background:linear-gradient(115deg,#e4f5f3,#f8fbfb);border:1px solid #d5e9e7;border-radius:16px;padding:20px}.dashboard-head h2{margin:5px 0;font-size:24px}.dashboard-head p{margin:0}.dashboard-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.dashboard-metric{background:#fff;border:1px solid #dce9e9;border-radius:14px;padding:18px;min-width:0}.dashboard-metric .stat{font-size:clamp(21px,3vw,29px);overflow-wrap:anywhere}.dashboard-metric .metric-label{display:flex;gap:8px;align-items:center;color:#607777;font-size:13px;margin-bottom:8px}.dashboard-panels{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}.dashboard-panel{background:white;border:1px solid #dce9e9;border-radius:16px;padding:18px;min-width:0}.dashboard-panel h3{margin:0 0 16px;font-size:18px}.stage-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stage-tile{background:#f4f8f8;color:#193b3e;text-align:left;border:1px solid #e0eded;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}.stage-tile:hover,.stage-tile:focus-visible{outline:2px solid #168c91;outline-offset:1px}.stage-tile[aria-pressed="true"]{background:#e2f3f1;border-color:#168c91}.stage-tile .stage-top{display:flex;justify-content:space-between;align-items:center;gap:8px}.stage-tile .stage-icon{font-size:21px}.stage-tile .stage-number{font-size:27px;font-weight:800}.stage-tile .stage-name{font-size:14px;font-weight:650}.stage-list{margin-top:18px}.stage-list h4{margin:0 0 8px}.dashboard-entry{padding:12px 0;border-bottom:1px solid #e5eeee;line-height:1.5}.dashboard-entry:last-child{border-bottom:0}.dashboard-entry .muted{margin-top:3px}.due-tag{display:inline-block;border-radius:20px;padding:3px 9px;font-size:12px;font-weight:700;background:#e7f3f1;color:#176b65}.due-tag.late{background:#ffe8e5;color:#9b3030}.dashboard-empty{color:#607777;font-size:14px;padding:10px 0}@media(max-width:700px){.dashboard-panels{grid-template-columns:1fr}.dashboard-head{padding:16px}.dashboard-panel{padding:15px}.dashboard-metric{padding:14px}}@media(max-width:360px){.dashboard-summary{grid-template-columns:1fr}}
</style></head><body><header><h1>START Odontologia Digital</h1><button id="logout" class="secondary hidden">Sair</button></header><div id="auth" class="wrap"><div class="card"><h2>Acesso seguro</h2><p class="muted">Entre com a conta cadastrada no Supabase.</p><label>E-mail<input id="email" type="email" autocomplete="username"></label><label>Senha<input id="senha" type="password" autocomplete="current-password"></label><div class="row"><button id="entrar">Entrar</button><button id="cadastrar" class="secondary">Criar conta</button></div></div></div><div id="app" class="hidden"><nav class="nav" id="nav"></nav><main class="wrap"><div id="msg"></div><div id="content"></div></main></div><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id), cfg=window.START_CONFIG||{};let sb,session=null,tab='Início',cache={},items=[];const tabs=['Início','Clientes','Serviços','Orçamentos','Ordens de serviço','Financeiro','Backup'];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const brl=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const date=s=>{if(!s)return '';const v=String(s);if(/^\d{4}-\d{2}-\d{2}$/.test(v)){const [y,m,d]=v.split('-');return `${d}/${m}/${y}`}const dt=new Date(v);return Number.isNaN(dt.getTime())?v:dt.toLocaleDateString('pt-BR')};const val=id=>$(id)?.value.trim()||'';const num=id=>Number($(id)?.value||0);const notice=(s,error=false)=>{$('msg').innerHTML=`<div class="notice ${error?'error':''}">${esc(s)}</div>`;window.scrollTo(0,0)};const safe=async fn=>{try{await fn()}catch(e){notice(e.message||String(e),true)}};function start(){if(!cfg.url?.startsWith('https://')||!cfg.anonKey||cfg.anonKey.startsWith('COLE_')){$('auth').innerHTML='<div class="card">Configure primeiro o arquivo <b>config.js</b> com a URL e a chave pública do Supabase.</div>';return}sb=window.supabase.createClient(cfg.url,cfg.anonKey);sb.auth.onAuthStateChange((_event,s)=>{session=s;$('auth').classList.toggle('hidden',!!s);$('app').classList.toggle('hidden',!s);$('logout').classList.toggle('hidden',!s);if(s)void safe(async()=>{await refresh();render()})});$('entrar').onclick=()=>safe(async()=>{const {error}=await sb.auth.signInWithPassword({email:val('email'),password:val('senha')});if(error)throw error});$('cadastrar').onclick=()=>safe(async()=>{const {data,error}=await sb.auth.signUp({email:val('email'),password:val('senha')});if(error)throw error;alert(data.session?'Conta criada.':'Verifique seu e-mail para confirmar o cadastro.')});$('logout').onclick=()=>sb.auth.signOut();sb.auth.getSession().then(({data})=>{if(data.session){session=data.session; $('auth').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');safe(async()=>{await refresh();render()})}})}
async function query(table){const {data,error}=await sb.from(table).select('*').order(table==='clientes'?'nome':table==='servicos'?'descricao':'data',{ascending:false});if(error)throw error;return data||[]}async function refresh(){const [clientes,servicos,orcamentos,ordens,recebimentos]=await Promise.all(['clientes','servicos','orcamentos','ordens','recebimentos'].map(query));cache={clientes,servicos,orcamentos,ordens,recebimentos}}async function write(table,data,id){const q=id?sb.from(table).update(data).eq('id',id):sb.from(table).insert(data);const {error}=await q;if(error)throw error;await refresh();render();notice('Salvo na nuvem com sucesso.')}async function del(table,id){
  if(table!=='ordens'){
    if(!confirm('Confirma a exclusão?'))return;
    return safe(async()=>{
      const {error}=await sb.from(table).delete().eq('id',id);
      if(error)throw error;
      await refresh();render();notice('Registro excluído.');
    });
  }
  const ordem=cache.ordens.find(o=>String(o.id)===String(id));
  if(!ordem)return notice('Ordem não encontrada. Atualize os dados.',true);
  const vinculados=cache.recebimentos.filter(p=>String(p.ordem_id)===String(id));
  const aviso=`EXCLUSÃO DEFINITIVA DE TESTE\\n\\nOS #${ordem.numero} — ${clientName(ordem.codigo_cliente)}\\nPagamentos vinculados: ${vinculados.length}\\n\\nA ordem e seus pagamentos serão apagados permanentemente. Os pagamentos das outras ordens serão preservados.\\n\\nDeseja continuar?`;
  if(!confirm(aviso))return;
  await safe(async()=>{
    // A chave de associação restringe a exclusão da OS enquanto houver recebimentos.
    // Excluímos somente recebimentos com ordem_id igual ao ID desta OS.
    if(vinculados.length){
      const {error:pagError}=await sb.from('recebimentos').delete().eq('ordem_id',id);
      if(pagError)throw Error('Não foi possível excluir os pagamentos desta OS: '+pagError.message);
      const {data:restantes,error:checkError}=await sb.from('recebimentos').select('id').eq('ordem_id',id).limit(1);
      if(checkError)throw Error('Não foi possível verificar os pagamentos: '+checkError.message);
      if(restantes?.length)throw Error('Ainda existem pagamentos vinculados. A ordem não foi excluída.');
    }
    const {data:apagadas,error:osError}=await sb.from('ordens').delete().eq('id',id).select('id');
    if(osError)throw Error('Os pagamentos foram tratados, mas não foi possível excluir a OS: '+osError.message+'. Atualize os dados antes de tentar novamente.');
    if(!apagadas?.length)throw Error('O Supabase não confirmou a exclusão da OS. Verifique as permissões.');
    await refresh();render();
    notice('OS #'+ordem.numero+' e seus pagamentos de teste excluídos. Financeiro atualizado.');
  });
}function displayCode(table,id){const rows=[...(cache[table]||[])].sort((a,b)=>String(a.codigo).localeCompare(String(b.codigo),'pt-BR',{numeric:true})||String(a.id).localeCompare(String(b.id)));const i=rows.findIndex(x=>x.id===id);return i<0?'---':String(i+1).padStart(3,'0')}function nextDisplayCode(table){return String((cache[table]||[]).length+1).padStart(3,'0')}function newInternalCode(){return crypto.randomUUID()}function clientName(c){return cache.clientes.find(x=>x.codigo===c)?.nome||c}const stages=['Recebido','Em produção','Finalizado','Entregue'];
const statusOf=i=>stages.includes(i.situacao)?i.situacao:'Recebido';
const allProduction=()=>cache.ordens.flatMap(o=>(Array.isArray(o.itens)?o.itens:[]).map((i,k)=>({o,i,k})));
const paymentHistory=id=>cache.recebimentos.filter(p=>p.ordem_id===id).sort((a,b)=>String(a.data).localeCompare(String(b.data))).map(p=>`<div class="muted">${date(p.data)} · ${esc(p.forma)} · <b>${brl(p.valor)}</b> <button type="button" class="secondary" data-receipt="${p.id}">Recibo</button></div>`).join('')||'<div class="muted">Nenhum pagamento registrado.</div>';
async function updateStage(id,index,status){if(!stages.includes(status))throw Error('Etapa inválida.');const {data:current,error:readError}=await sb.from('ordens').select('itens').eq('id',id).single();if(readError)throw readError;const next=Array.isArray(current.itens)?structuredClone(current.itens):[];if(!next[index])throw Error('Serviço não encontrado. Atualize a página.');next[index].situacao=status;const {error}=await sb.from('ordens').update({itens:next}).eq('id',id);if(error)throw error;await refresh();render();notice('Etapa atualizada na nuvem.');}
function paid(id){return cache.recebimentos.filter(x=>x.ordem_id===id).reduce((a,b)=>a+Number(b.valor),0)}function render(){if(!session)return;$('nav').innerHTML=tabs.map(t=>`<button class="${t===tab?'active':''}" data-tab="${esc(t)}">${esc(t)}</button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('msg').innerHTML='';$('content').innerHTML=tab==='Início'?home():tab==='Clientes'?clients():tab==='Serviços'?services():tab==='Orçamentos'?records('orcamentos'):tab==='Ordens de serviço'?records('ordens'):tab==='Financeiro'?finance():backupPage();bind()}
function home(){
 const orders=cache.ordens||[];
 const outstanding=orders.reduce((a,o)=>a+Math.max(0,Number(o.total)-paid(o.id)),0);
 const production=allProduction();
 const activeOrders=orders.filter(o=>Array.isArray(o.itens)&&o.itens.some(i=>statusOf(i)!=='Entregue')).length;
 const today=new Date();today.setHours(12,0,0,0);
 const upcoming=orders.filter(o=>o.entrega&&Array.isArray(o.itens)&&o.itens.some(i=>statusOf(i)!=='Entregue')).map(o=>({o,days:Math.round((new Date(String(o.entrega).slice(0,10)+'T12:00:00')-today)/86400000)})).filter(x=>Number.isFinite(x.days)&&x.days<=7).sort((a,b)=>a.days-b.days);
 const tiles=[{name:'Recebido',symbol:'📥'},{name:'Em produção',symbol:'⚙️'},{name:'Finalizado',symbol:'✓'},{name:'Entregue',symbol:'📦'}];
 return `<section class="dashboard"><div class="dashboard-head"><div class="muted">START ODONTOLOGIA DIGITAL</div><h2>Visão geral do laboratório</h2><p class="muted">Produção, entregas e financeiro em um só lugar</p></div>
 <div class="dashboard-summary"><div class="dashboard-metric"><div class="metric-label">◉ Saldo a receber</div><div class="stat money">${brl(outstanding)}</div></div><div class="dashboard-metric"><div class="metric-label">▤ OS em aberto</div><div class="stat">${activeOrders}</div></div></div>
 <div class="dashboard-panels"><section class="dashboard-panel"><h3>Etapas de produção</h3><div class="stage-grid">${tiles.map(t=>`<button type="button" class="stage-tile" data-stage-filter="${esc(t.name)}" aria-pressed="false"><span class="stage-top"><span class="stage-icon" aria-hidden="true">${t.symbol}</span><span class="stage-number">${production.filter(x=>statusOf(x.i)===t.name).length}</span></span><span class="stage-name">${esc(t.name)}</span></button>`).join('')}</div><p class="muted">Selecione uma etapa para consultar os serviços.</p><div id="productionDetail" class="stage-list"><p class="dashboard-empty">Escolha uma das etapas acima.</p></div></section>
 <section class="dashboard-panel"><h3>Entregas próximas e atrasadas</h3>${upcoming.map(({o,days})=>`<div class="dashboard-entry"><b>OS #${esc(o.numero)} — ${esc(clientName(o.codigo_cliente))}</b><div class="muted">Entrega: ${esc(date(o.entrega))}</div><span class="due-tag ${days<0?'late':''}">${days<0?'Atrasada':days===0?'Entrega hoje':'Próximos 7 dias'}</span></div>`).join('')||'<p class="dashboard-empty">Nenhuma entrega atrasada ou prevista para os próximos 7 dias.</p>'}</section></div></section>`;
}
function clients(){return `<h2>Clientes</h2><div class="card"><form id="clientForm"><input type="hidden" id="cid"><div class="grid"><label>Código automático<input id="ccode" readonly title="Numeração exibida automaticamente"></label><label>Nome<input id="cname" required></label><label>Telefone<input id="cphone"></label><label>E-mail<input id="cemail" type="email"></label></div><button>Salvar cliente</button> <button type="reset" class="secondary">Limpar</button></form></div><div class="card"><input id="search" placeholder="Buscar cliente"><div id="list">${cache.clientes.map(c=>`<div class="item"><b>${esc(c.nome)}</b> <span class="muted">(${displayCode("clientes",c.id)})</span><div class="muted">${esc(c.telefone)} · ${esc(c.email)}</div><div class="actions"><button class="secondary" data-edit-client="${c.id}">Editar</button><button class="danger" data-del="clientes:${c.id}">Excluir</button></div></div>`).join('')||'Nenhum cliente cadastrado.'}</div></div>`}
function services(){return `<h2>Serviços</h2><div class="card"><form id="serviceForm"><input type="hidden" id="sid"><div class="grid"><label>Código automático<input id="scode" readonly title="Numeração exibida automaticamente"></label><label>Descrição<input id="sdesc" required></label><label>Valor (R$)<input id="sprice" type="number" min="0" step="0.01" required></label></div><button>Salvar serviço</button> <button type="reset" class="secondary">Limpar</button></form></div><div class="card"><input id="search" placeholder="Buscar serviço"><div id="list">${cache.servicos.map(s=>`<div class="item"><b>${esc(s.descricao)}</b> · ${displayCode("servicos",s.id)} <span class="money">${brl(s.valor)}</span><div class="actions"><button class="secondary" data-edit-service="${s.id}">Editar</button><button class="danger" data-del="servicos:${s.id}">Excluir</button></div></div>`).join('')||'Nenhum serviço cadastrado.'}</div></div>`}
const clientOptions=()=>cache.clientes.map(c=>`<option value="${esc(c.codigo)}">${esc(c.nome)} (${displayCode("clientes",c.id)})</option>`).join('');const serviceOptions=()=>cache.servicos.map(s=>`<option value="${esc(s.id)}">${esc(s.descricao)} — ${brl(s.valor)}</option>`).join('');function records(table){const os=table==='ordens';return `<h2>${os?'Ordens de serviço':'Orçamentos'}</h2><div class="card"><h3 id="formTitle">Novo ${os?'OS':'orçamento'}</h3><form id="recordForm" data-table="${table}"><input type="hidden" id="rid"><label>Cliente<select id="rclient" required><option value="">Selecione</option>${clientOptions()}</select></label><div class="grid">${os?'<label>Entrega prevista<input id="rentrega" type="date"></label>':'<label>Validade<input id="rvalidade" placeholder="Ex.: 15 dias"></label><label>Prazo<input id="rprazo" placeholder="Ex.: 5 dias úteis"></label><label>Pagamento<input id="rpagamento" placeholder="Ex.: PIX / parcelado"></label>'}</div><div class="card"><label>Serviço<select id="pickservice"><option value="">Selecione</option>${serviceOptions()}</select></label><div class="grid"><label>Quantidade<input id="pickqty" type="number" min="1" value="1"></label>${os?'<label>Dentes<input id="pickteeth" placeholder="Ex.: 14, 15"></label><label>Cor<input id="pickshade" placeholder="Ex.: A2"></label><label>Material<input id="pickmaterial" placeholder="Ex.: Dissilicato"></label>':''}<label>Desconto<input id="pickdisc" type="number" min="0" step="0.01" value="0"></label><label>Tipo de desconto<select id="pickdisctype"><option value="valor">R$ (valor)</option><option value="porcentagem">% (porcentagem)</option></select></label></div><button type="button" id="additem" class="secondary">Adicionar item</button><div id="itemlist"></div></div>${os?'<label>Observações<textarea id="robs"></textarea></label>':''}<button>Salvar ${os?'OS':'orçamento'}</button> <button type="button" class="secondary" id="clearRecord">Novo / Limpar</button></form></div><div class="card"><input id="search" placeholder="Buscar pelo cliente ou número"><div id="list">${cache[table].map(r=>`<div class="item"><b>${os?'OS':'Orçamento'} #${r.numero}</b> — ${esc(clientName(r.codigo_cliente))}<div class="muted">${date(r.data)} ${os&&r.entrega?'· Entrega: '+esc(date(r.entrega)):''}</div><div class="money">${brl(r.total)}</div>${os?`<div class="muted">Recebido: ${brl(paid(r.id))} · Saldo: ${brl(Math.max(0,Number(r.total)-paid(r.id)))}</div><div class="card"><b>Produção por serviço</b>${(Array.isArray(r.itens)?r.itens:[]).map((i,k)=>`<div class="item"><b>${esc(i.descricao)}</b><div class="muted">Dentes: ${esc(i.dentes||'-')} · Cor: ${esc(i.cor||'-')} · Material: ${esc(i.material||'-')}</div><label>Etapa<select data-stage-os="${r.id}" data-stage-index="${k}">${stages.map(st=>`<option value="${esc(st)}" ${statusOf(i)===st?'selected':''}>${esc(st)}</option>`).join('')}</select></label></div>`).join('')}</div><div class="card"><b>Histórico de pagamentos</b>${paymentHistory(r.id)}</div>`:''}<div class="actions"><button class="secondary" data-edit-record="${table}:${r.id}">Editar</button><button class="secondary" data-print="${table}:${r.id}">Imprimir / PDF</button>${os?`<button data-pay="${r.id}">Pagamento</button>`:`<button type="button" data-convert="${r.id}">Gerar OS</button>`}<button class="danger" data-del="${table}:${r.id}">Excluir</button></div></div>`).join('')||'Nenhum registro.'}</div></div>`}
function finance(){const rec=cache.recebimentos.slice().sort((a,b)=>b.data.localeCompare(a.data));const received=rec.reduce((a,p)=>a+Number(p.valor),0);return `<h2>Financeiro</h2><div class="grid"><div class="card"><div class="muted">Total recebido</div><div class="stat">${brl(received)}</div></div><div class="card"><div class="muted">A receber</div><div class="stat">${brl(cache.ordens.reduce((a,o)=>a+Math.max(0,Number(o.total)-paid(o.id)),0))}</div></div></div><div class="card"><label>Filtrar por mês<input type="month" id="monthFilter"></label><button id="printFinance" class="secondary">Imprimir relatório</button><div id="payments">${paymentRows(rec)}</div></div><div class="card"><h3>Fechamento mensal por cliente</h3><p class="muted">Relatório individual das OS emitidas no mês, incluindo as quitadas, descontos, pagamentos vinculados e saldo.</p><div class="grid"><label>Cliente<select id="closingClient"><option value="">Selecione um cliente</option>${clientOptions()}</select></label><label>Mês de referência<input type="month" id="closingMonth" value="${new Date().toISOString().slice(0,7)}"></label></div><button type="button" id="closingPreview">Consultar fechamento</button> <button type="button" id="closingPrint" class="secondary">Imprimir / PDF</button><div id="closingResult" class="item muted">Selecione cliente e mês para consultar.</div></div>`}function paymentRows(rows){return rows.map(p=>{const o=cache.ordens.find(x=>x.id===p.ordem_id);return `<div class="item"><b>${brl(p.valor)}</b> · ${esc(p.forma)}<div class="muted">${date(p.data)} · OS #${o?.numero||'?'} · ${esc(o?clientName(o.codigo_cliente):'')}</div><button class="secondary" data-receipt="${p.id}">Recibo</button></div>`}).join('')||'<p>Nenhum recebimento no período.</p>'}
function monthlyClosing(client,month){
 if(!client||!/^[0-9]{4}-[0-9]{2}$/.test(month))throw Error('Selecione o cliente e o mês.');
 const orders=(cache.ordens||[]).filter(o=>o.codigo_cliente===client&&String(o.data||'').slice(0,7)===month).sort((a,b)=>String(a.data).localeCompare(String(b.data))||String(a.numero).localeCompare(String(b.numero)));
 const ids=new Set(orders.map(o=>String(o.id)));
 const payments=(cache.recebimentos||[]).filter(p=>ids.has(String(p.ordem_id))).sort((a,b)=>String(a.data).localeCompare(String(b.data)));
 const total=orders.reduce((sum,o)=>sum+Number(o.total||0),0);
 const received=payments.reduce((sum,p)=>sum+Number(p.valor||0),0);
 const gross=orders.reduce((sum,o)=>sum+(Array.isArray(o.itens)?o.itens:[]).reduce((v,i)=>v+Number(i.quantidade||0)*Number(i.preco||0),0),0);
 const discount=orders.reduce((sum,o)=>sum+(Array.isArray(o.itens)?o.itens:[]).reduce((v,i)=>v+discountOf(i),0),0);
 const name=clientName(client);
 const orderRows=orders.map(o=>{
  const rows=(Array.isArray(o.itens)?o.itens:[]).map(i=>`<tr><td>${esc(date(o.data))}</td><td>${esc(o.numero)}</td><td>${esc(i.descricao)}${i.dentes?' · Dentes: '+esc(i.dentes):''}${i.cor?' · Cor: '+esc(i.cor):''}${i.material?' · Material: '+esc(i.material):''}</td><td class="num">${Number(i.quantidade||0)}</td><td class="num">${brl(i.preco)}</td><td class="num">${brl(discountOf(i))}</td><td class="num">${brl(Number(i.quantidade||0)*Number(i.preco||0)-discountOf(i))}</td></tr>`).join('');
  return rows||`<tr><td>${esc(date(o.data))}</td><td>${esc(o.numero)}</td><td colspan="4">Sem itens detalhados</td><td class="num">${brl(o.total)}</td></tr>`;
 }).join('');
 const payRows=payments.map(p=>{const o=orders.find(x=>String(x.id)===String(p.ordem_id));return `<tr><td>${esc(date(p.data))}</td><td>OS #${esc(o?.numero||'')}</td><td>${esc(p.forma||'Não informada')}</td><td class="num">${brl(p.valor)}</td></tr>`}).join('');
 const [year,m]=month.split('-');const monthName=new Date(Number(year),Number(m)-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
 const body=`<p><b>Cliente:</b> ${esc(name)}<br><b>Referência:</b> ${esc(monthName)}<br><b>Ordens de serviço:</b> ${orders.length}</p>
 <h3>ORDENS DE SERVIÇO EMITIDAS NO MÊS</h3><table class="report-table"><thead><tr><th>Data OS</th><th>OS</th><th>Serviço</th><th>Qtd.</th><th>Unitário</th><th>Desconto</th><th>Subtotal</th></tr></thead><tbody>${orderRows||'<tr><td colspan="7">Nenhuma OS no período.</td></tr>'}</tbody></table>
 <div class="report-totals"><p>Valor bruto: <b>${brl(gross)}</b></p><p>Descontos: <b>${brl(discount)}</b></p><p>Total das OS: <b>${brl(total)}</b></p></div>
 <h3>Pagamentos vinculados às OS acima</h3><table class="report-table"><thead><tr><th>Data do pagamento</th><th>Referência</th><th>Forma</th><th>Valor</th></tr></thead><tbody>${payRows||'<tr><td colspan="4">Nenhum pagamento registrado para estas OS.</td></tr>'}</tbody></table>
 <div class="report-totals"><p>Total recebido: <b>${brl(received)}</b></p><p class="closing-balance">Saldo das OS do mês: <b>${brl(total-received)}</b></p></div>
 `;
 return {body,orders,total,received,name};
}
function backupPage(){return `<h2>Backup e sincronização</h2><div class="card"><h3>Sincronização</h3><p>Os dados são consultados diretamente no Supabase. Use Atualizar dados para buscar as informações mais recentes.</p><button id="syncNow">Atualizar dados</button></div><div class="card"><h3>Cópia de segurança</h3><p>Baixe uma cópia em JSON dos clientes, serviços, orçamentos, ordens de serviço e recebimentos visíveis para sua conta. Guarde o arquivo em local seguro: ele pode conter dados pessoais e financeiros.</p><button id="backupNow" class="secondary">Baixar backup JSON</button><p class="muted">Esta versão faz a exportação. A restauração automática será adicionada após conferirmos a estrutura e as regras de segurança do banco.</p></div>`}
function downloadBackup(){const tables=['clientes','servicos','orcamentos','ordens','recebimentos'];const payload={app:'START Odontologia Digital',versao:1,criado_em:new Date().toISOString(),dados:Object.fromEntries(tables.map(t=>[t,cache[t]||[]]))};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='START-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function discountOf(i){const base=Number(i.quantidade||0)*Number(i.preco||0);const kind=String(i.desconto_tipo||'valor').toLowerCase();const raw=Number(i.desconto_valor||0);if(['porcentagem','percentual','%','percent','porcento'].includes(kind))return Math.round(base*raw)/100;return raw}function discountLabel(i){const kind=String(i.desconto_tipo||'valor').toLowerCase();return (['porcentagem','percentual','%','percent','porcento'].includes(kind))?`${Number(i.desconto_valor||0).toLocaleString('pt-BR')}% (${brl(discountOf(i))})`:brl(discountOf(i))}function renderItems(){const el=$('itemlist');if(!el)return;el.innerHTML=items.map((i,k)=>`<div class="item"><b>${esc(i.descricao)}</b><div class="muted">${i.quantidade} × ${brl(i.preco)} · desconto ${discountLabel(i)}</div>${i.dentes||i.cor||i.material?`<div class="muted">Dentes: ${esc(i.dentes||'-')} · Cor: ${esc(i.cor||'-')} · Material: ${esc(i.material||'-')}</div>`:''}<b>${brl(i.quantidade*i.preco-discountOf(i))}</b> <button type="button" class="danger" data-remove="${k}">Remover</button></div>`).join('')+`<p class="muted">Valor bruto: ${brl(items.reduce((a,i)=>a+Number(i.quantidade)*Number(i.preco),0))} · Descontos: ${brl(items.reduce((a,i)=>a+discountOf(i),0))}</p><p class="money">Total: ${brl(totalItems())}</p>`;el.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{items.splice(+b.dataset.remove,1);renderItems()})}function totalItems(){return Math.round(items.reduce((a,i)=>a+i.quantidade*i.preco-discountOf(i),0)*100)/100}
function bind(){if($('closingPreview'))$('closingPreview').onclick=()=>safe(async()=>{await refresh();const result=monthlyClosing(val('closingClient'),val('closingMonth'));$('closingResult').innerHTML=`<b>${esc(result.name)}</b> · ${result.orders.length} OS · Total: ${brl(result.total)} · Recebido: ${brl(result.received)} · Saldo: ${brl(result.total-result.received)}`;});if($('closingPrint'))$('closingPrint').onclick=()=>safe(async()=>{const client=val('closingClient'),month=val('closingMonth');await refresh();const result=monthlyClosing(client,month);if(!result.orders.length)return alert('Não há ordens de serviço desse cliente no mês selecionado.');printHtml('FECHAMENTO MENSAL',result.body);});if($('ccode')){$('ccode').value=nextDisplayCode('clientes');$('clientForm').addEventListener('reset',()=>setTimeout(()=>{$('cid').value='';$('ccode').value=nextDisplayCode('clientes')},0))}if($('scode')){$('scode').value=nextDisplayCode('servicos');$('serviceForm').addEventListener('reset',()=>setTimeout(()=>{$('sid').value='';$('scode').value=nextDisplayCode('servicos')},0))}document.querySelectorAll('[data-stage-filter]').forEach(b=>b.onclick=()=>{const st=b.dataset.stageFilter;document.querySelectorAll('[data-stage-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));const matching=allProduction().filter(x=>statusOf(x.i)===st);$('productionDetail').innerHTML=`<h4>${esc(st)}</h4>${matching.map(({o,i})=>`<div class="item">OS #${esc(o.numero)} · ${esc(clientName(o.codigo_cliente))} · ${esc(i.descricao)}${o.entrega?' · Entrega '+date(o.entrega):''}</div>`).join('')||'<p class="muted">Nenhum serviço nesta etapa.</p>'}`});document.querySelectorAll('[data-stage-os]').forEach(el=>el.onchange=()=>safe(()=>updateStage(el.dataset.stageOs,Number(el.dataset.stageIndex),el.value)));if($('syncNow'))$('syncNow').onclick=()=>safe(async()=>{await refresh();render();notice('Dados atualizados da nuvem.')});if($('backupNow'))$('backupNow').onclick=()=>safe(async()=>{await refresh();downloadBackup();notice('Backup preparado para download.')});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const [t,id]=b.dataset.del.split(':');del(t,id)});document.querySelectorAll('[data-edit-client]').forEach(b=>b.onclick=()=>{const c=cache.clientes.find(x=>x.id===b.dataset.editClient);$('cid').value=c.id;$('ccode').value=displayCode('clientes',c.id);$('cname').value=c.nome;$('cphone').value=c.telefone;$('cemail').value=c.email;window.scrollTo(0,0)});document.querySelectorAll('[data-edit-service]').forEach(b=>b.onclick=()=>{const s=cache.servicos.find(x=>x.id===b.dataset.editService);$('sid').value=s.id;$('scode').value=displayCode('servicos',s.id);$('sdesc').value=s.descricao;$('sprice').value=s.valor;window.scrollTo(0,0)});if($('clientForm'))$('clientForm').onsubmit=e=>{e.preventDefault();safe(()=>write('clientes',{...(val('cid')?{}:{codigo:newInternalCode()}),nome:val('cname'),telefone:val('cphone'),email:val('cemail')},val('cid')||null))};if($('serviceForm'))$('serviceForm').onsubmit=e=>{e.preventDefault();safe(()=>write('servicos',{...(val('sid')?{}:{codigo:newInternalCode()}),descricao:val('sdesc'),valor:num('sprice')},val('sid')||null))};if($('additem')){$('additem').onclick=()=>{const s=cache.servicos.find(x=>x.id===val('pickservice')),q=num('pickqty'),d=num('pickdisc'),kind=val('pickdisctype');if(!s||!Number.isInteger(q)||q<=0||!Number.isFinite(d)||d<0||(kind==='porcentagem'?d>100:d>q*Number(s.valor)))return alert('Confira serviço, quantidade e desconto (máximo de 100% ou o valor do item).');items.push({codigo:s.codigo,descricao:s.descricao,preco:Number(s.valor),quantidade:q,desconto_tipo:kind,desconto_valor:d,situacao:'Recebido',dentes:val('pickteeth'),cor:val('pickshade'),material:val('pickmaterial')});renderItems()};$('clearRecord').onclick=()=>{items=[];render()};$('recordForm').onsubmit=e=>{e.preventDefault();safe(async()=>{if(!items.length)throw Error('Adicione um serviço.');const t=$('recordForm').dataset.table,id=val('rid');let data={codigo_cliente:val('rclient'),itens:items,total:totalItems()};if(t==='ordens'){data.entrega=val('rentrega');data.observacoes=val('robs');if(id&&paid(id)>data.total)throw Error('O total não pode ser menor que o valor já recebido.')}else{data.validade=val('rvalidade');data.prazo=val('rprazo');data.pagamento=val('rpagamento')}await write(t,data,id||null);items=[]})};renderItems()}
document.querySelectorAll('[data-edit-record]').forEach(b=>b.onclick=()=>{const [t,id]=b.dataset.editRecord.split(':'),r=cache[t]?.find(x=>x.id===id);if(!r){notice('Registro não encontrado. Atualize os dados e tente novamente.',true);return}items=Array.isArray(r.itens)?structuredClone(r.itens):[];$('rid').value=id;$('rclient').value=r.codigo_cliente;if(t==='ordens'){$('rentrega').value=/^\d{4}-\d\d-\d\d$/.test(r.entrega)?r.entrega:'';$('robs').value=r.observacoes||''}else{$('rvalidade').value=r.validade||'';$('rprazo').value=r.prazo||'';$('rpagamento').value=r.pagamento||''}$('formTitle').textContent='Editar #'+r.numero;renderItems();window.scrollTo(0,0)});document.querySelectorAll('[data-convert]').forEach(b=>b.onclick=()=>{const r=cache.orcamentos.find(x=>x.id===b.dataset.convert);if(!r)return notice('Orçamento não encontrado.',true);if(!confirm('Preparar uma nova Ordem de Serviço a partir do orçamento #'+r.numero+'? Confira os dados antes de salvar.'))return;tab='Ordens de serviço';items=Array.isArray(r.itens)?structuredClone(r.itens):[];render();$('rclient').value=r.codigo_cliente;$('robs').value='Origem: orçamento #'+r.numero+' ('+date(r.data)+'). Verificar se já existe OS para este orçamento antes de salvar.';$('formTitle').textContent='Nova OS — orçamento #'+r.numero;$('rid').value='';renderItems();window.scrollTo(0,0);notice('OS preparada a partir do orçamento #'+r.numero+'. Confira e clique em Salvar OS para criar o registro.');});document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>safe(async()=>{const id=b.dataset.pay,r=cache.ordens.find(x=>x.id===id),balance=Number(r.total)-paid(id);if(balance<=0)return alert('OS quitada.');const input=prompt(`Saldo ${brl(balance)}. Valor recebido (use ponto para decimais):`);if(input===null)return;const amount=Number(input.replace(',','.'));if(!Number.isFinite(amount)||amount<=0||amount>balance)throw Error('Valor inválido ou maior que o saldo.');const forma=prompt('Forma de pagamento (PIX, dinheiro, cartão etc.):');if(!forma?.trim())return;const {error}=await sb.rpc('registrar_pagamento',{p_ordem:id,p_valor:amount,p_forma:forma.trim()});if(error)throw error;await refresh();render();notice('Pagamento registrado com sucesso.')}));document.querySelectorAll('[data-print]').forEach(b=>b.onclick=()=>{const [t,id]=b.dataset.print.split(':');printRecord(t,cache[t].find(x=>x.id===id))});document.querySelectorAll('[data-receipt]').forEach(b=>b.onclick=()=>{const p=cache.recebimentos.find(x=>x.id===b.dataset.receipt),o=cache.ordens.find(x=>x.id===p.ordem_id);printHtml('RECIBO DE PAGAMENTO',`<p>Recebemos de <b>${esc(clientName(o?.codigo_cliente))}</b> a quantia de <b>${brl(p.valor)}</b>.</p><p>Referente à OS #${o?.numero||''}, em ${date(p.data)}. Forma: ${esc(p.forma)}.</p>`)});if($('search'))$('search').oninput=()=>{const term=val('search').toLowerCase();$('list').querySelectorAll('.item').forEach(x=>x.classList.toggle('hidden',!x.textContent.toLowerCase().includes(term)))};if($('monthFilter'))$('monthFilter').oninput=()=>{$('payments').innerHTML=paymentRows(cache.recebimentos.filter(p=>!val('monthFilter')||p.data.startsWith(val('monthFilter')))) ;bindReceipts()};if($('printFinance'))$('printFinance').onclick=()=>{const month=val('monthFilter');const ps=cache.recebimentos.filter(p=>!month||p.data.startsWith(month));printHtml('RELATÓRIO FINANCEIRO',`<p>Período: ${esc(month||'Todos')}</p>${ps.map(p=>`<p>${date(p.data)} · ${esc(p.forma)} · ${brl(p.valor)}</p>`).join('')}<h3>Total recebido: ${brl(ps.reduce((a,p)=>a+Number(p.valor),0))}</h3>`)} }
function bindReceipts(){document.querySelectorAll('[data-receipt]').forEach(b=>b.onclick=()=>{const p=cache.recebimentos.find(x=>x.id===b.dataset.receipt),o=cache.ordens.find(x=>x.id===p.ordem_id);printHtml('RECIBO DE PAGAMENTO',`<p>Recebemos de ${esc(clientName(o?.codigo_cliente))} o valor de <b>${brl(p.valor)}</b>, referente à OS #${o?.numero||''}.</p><p>Data: ${date(p.data)} · Forma: ${esc(p.forma)}</p>`)})}
function printRecord(t,r){const os=t==='ordens',lineItems=r.itens||[];const gross=lineItems.reduce((a,i)=>a+Number(i.quantidade||0)*Number(i.preco||0),0);const discount=lineItems.reduce((a,i)=>a+discountOf(i),0);const rows=lineItems.map(i=>`<tr><td>${esc(i.descricao)}${os?`<div style="font-size:11px">Etapa: ${esc(statusOf(i))} · Dentes: ${esc(i.dentes||'-')} · Cor: ${esc(i.cor||'-')} · Material: ${esc(i.material||'-')}</div>`:''}</td><td>${i.quantidade}</td><td>${brl(i.preco)}</td><td>${discountLabel(i)}</td><td>${brl(i.quantidade*i.preco-discountOf(i))}</td></tr>`).join('');printHtml(`${os?'ORDEM DE SERVIÇO':'ORÇAMENTO'} #${r.numero}`,`<p>Data: ${date(r.data)}<br>Cliente: ${esc(clientName(r.codigo_cliente))}</p><table style="width:100%;border-collapse:collapse" border="1" cellpadding="7"><tr><th>Serviço</th><th>Qtd.</th><th>Unitário</th><th>Desconto</th><th>Subtotal</th></tr>${rows}</table><p>Valor bruto: ${brl(gross)}<br>Descontos: ${brl(discount)}</p><h3>Total: ${brl(r.total)}</h3>${os?`<p>Entrega: ${esc(date(r.entrega)||'-')}<br>Observações: ${esc(r.observacoes||'-')}<br>Recebido: ${brl(paid(r.id))}<br>Saldo: ${brl(Math.max(0,Number(r.total)-paid(r.id)))}</p><h3>Pagamentos</h3>${paymentHistory(r.id).replace(/<button[^>]*>Recibo<\/button>/g,'')}`:`<p>Validade: ${esc(r.validade||'-')}<br>Prazo: ${esc(r.prazo||'-')}<br>Pagamento: ${esc(r.pagamento||'-')}</p>`}`)}function printHtml(title,body){const w=window.open('','_blank');if(!w)return alert('Permita pop-ups para imprimir.');w.document.write(`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>${esc(title)}</title><style>
